<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Details | eFootball Training Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="supabase_config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app-data.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', sans-serif;
            background:
                radial-gradient(circle at top left, rgba(59, 130, 246, 0.16), transparent 32%),
                radial-gradient(circle at top right, rgba(14, 165, 233, 0.09), transparent 26%),
                linear-gradient(180deg, #050816 0%, #02040a 58%, #010205 100%);
            color: #e2e8f0;
            position: relative;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.02), transparent 28%),
                linear-gradient(315deg, rgba(255, 255, 255, 0.015), transparent 22%);
            pointer-events: none;
            z-index: -1;
        }
        .brand-font { font-family: 'Teko', sans-serif; }
        .card-bg {
            background: linear-gradient(180deg, rgba(14, 20, 33, 0.95) 0%, rgba(4, 7, 13, 0.98) 100%);
            border: 1px solid rgba(148, 163, 184, 0.08);
            box-shadow: 0 18px 64px rgba(0, 0, 0, 0.22);
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(148, 163, 184, 0.1);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.16);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .stat-card:hover {
            border-color: rgba(59, 130, 246, 0.55);
            transform: translateY(-3px);
        }
        .empty-build {
            background: rgba(255, 255, 255, 0.03);
            border: 1px dashed rgba(148, 163, 184, 0.28);
        }
        .build-tag {
            display: inline-block;
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.4);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            color: #93c5fd;
            margin-right: 8px;
        }
    </style>
</head>
<body class="min-h-screen">
    <nav class="bg-black/95 border-b border-white/10 sticky top-0 z-40 backdrop-blur-xl">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16 sm:h-20">
                <button onclick="location.href='index.html'" class="flex items-center gap-2 text-slate-400 hover:text-white transition-colors group">
                    <svg class="w-5 h-5 group-hover:-translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    <span class="text-sm font-bold uppercase tracking-widest">Back to Hub</span>
                </button>
                <div class="brand-font text-2xl font-bold text-white tracking-widest flex items-center gap-2">
                    EF HUB
                    <span class="text-xs px-2 py-1 bg-blue-600/30 rounded border border-blue-500/50">DETAILS</span>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-8" id="detailContent">
        <div class="text-center py-20">
            <div class="animate-pulse">
                <div class="inline-block w-12 h-12 bg-blue-600 rounded-xl mb-4"></div>
                <p class="text-slate-400">Loading player data...</p>
            </div>
        </div>
    </main>

    <script>
        const STORAGE_KEY = 'efh_players_data_v1';

        async function loadPlayer() {
            try {
                const params = new URLSearchParams(window.location.search);
                const id = params.get('id');

                let players = [];
                if (window.EFHubData && typeof window.EFHubData.loadCollection === 'function') {
                    players = await window.EFHubData.loadCollection('players', {
                        order: { column: 'created_at', ascending: false }
                    });
                }
                if (!Array.isArray(players) || !players.length) {
                    const response = await fetch('players.json');
                    players = await response.json();
                }
                const player = players.find(p => String(p.id) === String(id));

                const container = document.getElementById('detailContent');

                if (!player) {
                    container.innerHTML = `
                        <div class="text-center py-20">
                            <h1 class="brand-font text-5xl font-bold text-white mb-4">Player Not Found</h1>
                            <p class="text-slate-400 mb-6">The player you're looking for doesn't exist in the database.</p>
                            <a href="index.html" class="inline-block px-6 py-3 bg-blue-600 hover:bg-blue-500 rounded-xl font-bold transition-colors">Return Home</a>
                        </div>
                    `;
                    return;
                }

                const playerImage = player.imageUrl || player.image_url || player.image || '';
                const playerRating = player.overallRating || player.overall_rating || player.rating || 0;
                const playerStyle = player.playingStyle || player.playstyle || '—';
                const playerBuild = player.build || player.stats || {};

                const buildStats = playerBuild && Object.keys(playerBuild).length > 0
                    ? `
                        <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
                            ${Object.entries(playerBuild).map(([key, val]) => `
                                <div class="stat-card p-6 rounded-2xl text-center hover:shadow-lg">
                                    <div class="text-[11px] text-blue-300 font-bold uppercase tracking-widest mb-2">${key}</div>
                                    <div class="text-4xl font-bold brand-font text-white">${val}</div>
                                </div>
                            `).join('')}
                        </div>
                    `
                    : `
                        <div class="empty-build p-12 rounded-2xl text-center">
                            <svg class="w-12 h-12 mx-auto mb-4 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                            </svg>
                            <p class="text-slate-500 font-bold">NO BUILD DATA</p>
                            <p class="text-slate-600 text-sm mt-1">Visit admin page to create a build for this player</p>
                        </div>
                    `;

                container.innerHTML = `
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
                        <div class="relative card-bg rounded-[3rem] p-8 text-center overflow-hidden group">
                            <div class="absolute inset-0 bg-blue-600/5 blur-3xl group-hover:blur-2xl transition-all"></div>
                            <img src="${playerImage}" class="w-72 mx-auto drop-shadow-[0_20px_50px_rgba(0,0,0,0.8)] relative z-10 hover:scale-105 transition-transform" alt="${player.name}">
                            <h1 class="text-6xl font-bold brand-font text-white mt-8 leading-none relative z-10">${player.name}</h1>
                            <p class="text-blue-400 font-bold uppercase tracking-[0.15em] mt-3 relative z-10">${player.team || 'International'}</p>
                        </div>

                        <div class="flex flex-col justify-center">
                            <div class="mb-8 pb-6 border-b border-white/10">
                                <div class="flex items-baseline justify-between mb-4 gap-4">
                                    <div>
                                        <div class="text-[11px] text-slate-500 font-bold uppercase tracking-widest">${player.position} • ${playerStyle}</div>
                                        <h2 class="text-4xl font-bold brand-font text-white uppercase mt-2">Player Stats</h2>
                                    </div>
                                    <div class="text-right">
                                        <div class="text-[10px] text-slate-500 font-bold uppercase">Max OVR</div>
                                        <div class="text-5xl font-bold brand-font text-blue-400">${playerRating}</div>
                                    </div>
                                </div>
                            </div>

                            <div class="mb-8">
                                <h3 class="text-sm font-bold text-blue-300 uppercase tracking-widest mb-4">Recommended Build</h3>
                                ${buildStats}
                            </div>

                            <div class="card-bg p-6 rounded-2xl border-2 border-blue-500/30 text-center">
                                <p class="text-slate-400 text-sm mb-3">Want to create a custom build for this player?</p>
                                <div class="flex flex-wrap justify-center gap-3">
                                    <a href="blog.html" class="inline-block px-6 py-2 bg-blue-600 hover:bg-blue-500 rounded-lg font-bold transition-colors text-white">Read Guides</a>
                                    <a href="compare.html" class="inline-block px-6 py-2 bg-white/5 hover:bg-white/10 rounded-lg font-bold transition-colors text-white border border-white/10">Compare</a>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            } catch (e) {
                console.error('Error loading player:', e);
                document.getElementById('detailContent').innerHTML = `
                    <div class="text-center py-20">
                        <h1 class="brand-font text-4xl font-bold text-red-400 mb-4">Error Loading Player</h1>
                        <p class="text-slate-400 mb-6">${e.message}</p>
                        <a href="index.html" class="inline-block px-6 py-3 bg-blue-600 hover:bg-blue-500 rounded-xl font-bold transition-colors">Return Home</a>
                    </div>
                `;
            }
        }

        window.addEventListener('load', loadPlayer);
        window.addEventListener('storage', (event) => {
            if (event.key === STORAGE_KEY) loadPlayer();
        });
    </script>
</body>
</html>
